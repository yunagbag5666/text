<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>간호학 공부노트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* Layout: one narrow column built for a phone. Home lists three subject blocks, each opens a unit list, each unit has three tabs (summary, cards, quiz). */
:root{
  --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --bg:#FBF8FF; --card:#FFFFFF; --ink:#352F52; --ink2:#675F8C; --line:#E8E2F6;
  --hl:#FFF0A8; --hl-ink:#4A3B00; --danger:#B8264C; --good:#0F7A56; --good-bg:#D9F5EA; --bad-bg:#FFE3EA;
  --t-tint:#EAE2FF; --t-mid:#BBA8FF; --t-on:#4F30B5;
  --a-tint:#FFE2EC; --a-mid:#FFA3C4; --a-on:#A32A5F;
  --n-tint:#D8F5E9; --n-mid:#88E0BF; --n-on:#0D6849;
  --on-mid:#2A2350; --shadow:0 6px 18px rgba(110,80,200,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1D1930; --card:#2A2544; --ink:#F2EEFF; --ink2:#B9B2D8; --line:#3E3862;
    --hl:#6B5A12; --hl-ink:#FFF1B0; --danger:#FF9DB3; --good:#86EBC4; --good-bg:#1F4A3D; --bad-bg:#5A2A3A;
    --t-tint:#392F6E; --t-on:#D6CBFF; --a-tint:#55304A; --a-on:#FFC4DA; --n-tint:#21483C; --n-on:#A9F2D4;
    --shadow:0 6px 18px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1D1930; --card:#2A2544; --ink:#F2EEFF; --ink2:#B9B2D8; --line:#3E3862;
  --hl:#6B5A12; --hl-ink:#FFF1B0; --danger:#FF9DB3; --good:#86EBC4; --good-bg:#1F4A3D; --bad-bg:#5A2A3A;
  --t-tint:#392F6E; --t-on:#D6CBFF; --a-tint:#55304A; --a-on:#FFC4DA; --n-tint:#21483C; --n-on:#A9F2D4;
  --shadow:0 6px 18px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.6;
  padding-block:12px 120px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit}
h1,h2,h3{font-weight:400;margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--on,var(--t-on));outline-offset:2px}

.sub-term{--tint:var(--t-tint);--mid:var(--t-mid);--on:var(--t-on)}
.sub-anat{--tint:var(--a-tint);--mid:var(--a-mid);--on:var(--a-on)}
.sub-nurs{--tint:var(--n-tint);--mid:var(--n-mid);--on:var(--n-on)}

.banner{background:var(--hl);color:var(--hl-ink);padding:10px 14px;border-radius:14px;font-size:14px;margin:4px 0 8px}

/* home */
.hero{position:relative;padding:18px 0 4px}
.eyebrow{display:inline-block;margin:0 0 10px;padding:3px 12px;border-radius:999px;background:var(--t-tint);color:var(--t-on);font-size:14px}
.hero h1{font-family:var(--display);font-size:46px;line-height:1.1;margin-bottom:8px}
.lede{margin:0;color:var(--ink2);max-width:28ch}
.blobs{position:absolute;right:0;top:10px;width:92px;height:92px}
.subjects{display:grid;gap:14px;margin-top:20px}
.subcard{position:relative;overflow:hidden;text-align:left;width:100%;border:0;border-radius:28px;background:var(--tint);color:var(--on);padding:20px 20px 18px;min-height:130px;display:flex;flex-direction:column;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s}
.subcard::after{content:"";position:absolute;right:-34px;top:-34px;width:140px;height:140px;border-radius:50%;background:var(--mid);opacity:.55}
.subcard:active{transform:scale(.98)}
.sc-name{position:relative;z-index:1;font-family:var(--display);font-size:28px;line-height:1.2}
.sc-en{position:relative;z-index:1;font-size:14px}
.sc-stats{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:14px}
.pill{display:inline-block;padding:2px 12px;border-radius:999px;background:var(--card);color:var(--ink);font-size:14px}
.seedbox{margin-top:20px;padding:18px;border-radius:24px;background:var(--card);border:2px dashed var(--line);display:grid;gap:12px;justify-items:start}
.seedbox p{margin:0;color:var(--ink2)}
.skel{height:130px;border-radius:28px;background:var(--tint);opacity:.55;animation:pulse 1.4s ease-in-out infinite}
.loading{color:var(--ink2);margin:16px 0 0}
@keyframes pulse{50%{opacity:.3}}

/* subject + unit */
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 14px 0 6px;margin-left:-6px;border:0;background:transparent;color:var(--on,var(--ink2));cursor:pointer;border-radius:999px;font-size:15px}
.ptitle{font-family:var(--display);font-size:34px;line-height:1.2;color:var(--on)}
.subline{margin:0 0 4px;color:var(--ink2);font-size:14px}
.addrow{display:flex;gap:8px;margin-top:14px}
.addrow input{flex:1;min-width:0}
input,textarea{width:100%;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:16px;padding:11px 14px;font:inherit;font-size:16px}
textarea{resize:vertical;line-height:1.7}
input:focus,textarea:focus{outline:none;border-color:var(--mid,var(--t-mid));box-shadow:0 0 0 3px color-mix(in srgb,var(--mid,var(--t-mid)) 40%,transparent)}
.units{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:10px}
.unit{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px 14px 12px 16px;cursor:pointer}
.u-main{flex:1;min-width:0;display:grid}
.u-title{font-family:var(--display);font-size:19px;line-height:1.35;overflow-wrap:anywhere}
.u-meta{color:var(--ink2);font-size:14px}
.u-best{background:var(--tint);color:var(--on);border-radius:999px;padding:1px 10px;font-size:14px;white-space:nowrap}
.empty{background:var(--card);border:2px dashed var(--line);border-radius:22px;padding:22px 18px;display:grid;gap:12px;justify-items:start;margin-top:16px}
.empty p{margin:0;color:var(--ink2)}

.title-input{font-family:var(--display);font-size:28px;line-height:1.25;border-color:transparent;background:transparent;padding:6px 8px;margin-top:2px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--tint);padding:5px;border-radius:999px;margin:12px 0 16px}
.tab{border:0;background:transparent;color:var(--on);font-family:var(--display);font-size:17px;min-height:42px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--card);box-shadow:var(--shadow)}
.card{background:var(--card);border-radius:24px;padding:18px;box-shadow:var(--shadow);border:1px solid var(--line)}
.row{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.end{justify-content:flex-end}
.state{color:var(--ink2);font-size:14px}
.hint{color:var(--ink2);font-size:14px;margin:0 0 10px;display:block}

.note{white-space:pre-wrap;overflow-wrap:anywhere;font-size:17px;line-height:1.85}
mark{background:var(--hl);color:var(--hl-ink);padding:0 4px;border-radius:6px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 22px;border:2px solid var(--mid,var(--t-mid));background:var(--mid,var(--t-mid));color:var(--on-mid);border-radius:999px;font-family:var(--display);font-size:17px;cursor:pointer}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.wide{width:100%;margin-top:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.linkbtn{border:0;background:transparent;color:var(--on,var(--ink2));font-size:14px;min-height:36px;padding:0 6px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.linkbtn.danger{color:var(--danger)}
.danger-zone{margin-top:28px;text-align:center}
.round{width:52px;height:52px;flex:none;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink)}

/* cards */
.deck-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.count{font-family:var(--display);color:var(--on);font-size:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:36px;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:0 12px;font-size:14px;cursor:pointer}
.chip.on{background:var(--tint);color:var(--on);border-color:var(--mid)}
.scene{perspective:1200px;height:232px}
.flip-card{position:relative;width:100%;height:100%;cursor:pointer;transform-style:preserve-3d;transition:transform .5s}
.flip-card.is-flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;overflow:auto;border-radius:28px;padding:34px 20px 20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:var(--shadow)}
.face>p{margin:auto;text-align:center;overflow-wrap:anywhere}
.front{background:var(--tint);color:var(--on)}
.face.rear{background:var(--card);border:2px solid var(--mid);transform:rotateY(180deg)}
.face-tag{position:absolute;left:18px;top:14px;font-size:13px;opacity:.85}
.term{font-family:var(--display);font-size:30px;line-height:1.3}
.mean{font-size:19px;line-height:1.6}
.deck-ctrl{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:14px}
.cardform{margin-top:18px;display:grid;gap:4px}
.cardform h3{font-family:var(--display);font-size:20px;color:var(--on);margin-bottom:4px}
.cardform label{font-size:14px;color:var(--ink2);margin-top:8px}
.cardlist{list-style:none;margin:18px 0 0;padding:0}
.crow{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px dashed var(--line)}
.crow:first-child{border-top:0}
.cr-text{flex:1;min-width:0}
.cr-f{font-family:var(--display);font-size:18px;line-height:1.4;margin:0;overflow-wrap:anywhere}
.cr-b{margin:2px 0 0;color:var(--ink2);font-size:15px;overflow-wrap:anywhere}
.cr-btns{display:grid}
.star{color:var(--on)}

/* quiz */
.quizstart h3,.result h3{font-family:var(--display);font-size:21px;color:var(--on)}
.quizstart p{margin:8px 0 12px;color:var(--ink2)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{min-height:52px;border:2px solid var(--line);background:var(--card);border-radius:16px;padding:6px 8px;font-size:15px;cursor:pointer}
.seg button.on{background:var(--tint);color:var(--on);border-color:var(--mid)}
.progress{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.progress span{display:block;height:100%;background:var(--mid);border-radius:999px;transition:width .3s}
.qcount{font-family:var(--display);color:var(--on);margin:12px 0 4px}
.qtext{font-family:var(--display);font-size:24px;line-height:1.4;margin:0 0 16px;overflow-wrap:anywhere}
.qtag{display:inline-block;font-family:var(--body);font-size:13px;background:var(--tint);color:var(--on);border-radius:999px;padding:0 10px;margin-right:8px;vertical-align:middle}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;min-height:54px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:12px 14px;cursor:pointer;overflow-wrap:anywhere}
.opt .num{flex:none;color:var(--on)}
.opt[disabled]{opacity:1;cursor:default;color:var(--ink)}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--danger)}
.fb{margin:14px 0 0;font-family:var(--display)}
.fb.good{color:var(--good)}
.fb.bad{color:var(--danger)}
.ring{--p:0;position:relative;width:128px;height:128px;border-radius:50%;margin:4px auto 12px;display:grid;place-items:center;background:conic-gradient(var(--mid) calc(var(--p)*1%),var(--line) 0)}
.ring::before{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--card)}
.ring span{position:relative;font-family:var(--display);font-size:38px;color:var(--ink)}
.ring small{font-size:18px}
.rtext{text-align:center;font-family:var(--display);font-size:20px;margin:0}
.rmsg{text-align:center;color:var(--ink2);margin:4px 0 14px}
.wronglist{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.wronglist li{background:var(--tint);color:var(--ink);border-radius:14px;padding:8px 12px;overflow-wrap:anywhere}
.wronglist b{font-family:var(--display);font-weight:400;color:var(--on)}

#toast{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;
  padding:12px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:none}
#toast span{background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 18px;font-size:15px;max-width:100%}

@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
}
</style>

<div class="wrap"><div id="app"></div></div>
<div id="toast" role="status" aria-live="polite"><span></span></div>

<script>
(function(){
'use strict';
document.documentElement.lang='ko';
const app=document.getElementById('app');
const toastEl=document.getElementById('toast');

const SUBS={
  term:{name:'의학용어',en:'Medical Terminology',cls:'sub-term'},
  anat:{name:'해부생리',en:'Anatomy & Physiology',cls:'sub-anat'},
  nurs:{name:'기본간호학',en:'Fundamentals of Nursing',cls:'sub-nurs'}
};
const ICON_L='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';
const ICON_R='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';

const EXAMPLES=[
 {sub:'term',title:'접두사·접미사 기초 (예시)',
  summary:'의학용어는 [접두사] + [어근] + [접미사]로 나눠서 읽으면 쉬워요.\n\n• [접두사](prefix): 앞에 붙어 정도·위치·수를 알려줘요. 예) hyper- 과다, hypo- 부족\n• [어근](root): 중심이 되는 뜻이에요. 예) gastr- 위, cardi- 심장\n• [접미사](suffix): 뒤에 붙어 병·수술·상태를 알려줘요. 예) -itis 염증, -ectomy 절제술\n\n예) gastr + itis = 위염(gastritis)',
  cards:[
   ['hyper- (과다)','정상보다 지나치게 많음. 예) hypertension 고혈압'],
   ['hypo- (저하)','정상보다 부족하거나 낮음. 예) hypotension 저혈압'],
   ['tachy- (빠른)','속도가 빠름. 예) tachycardia 빈맥'],
   ['brady- (느린)','속도가 느림. 예) bradycardia 서맥'],
   ['-itis (염증)','염증을 뜻하는 접미사. 예) gastritis 위염'],
   ['-ectomy (절제술)','장기나 조직을 잘라내는 수술. 예) appendectomy 충수절제술'],
   ['-pathy (질병)','질병 상태를 뜻하는 접미사. 예) neuropathy 신경병증']
  ]},
 {sub:'anat',title:'세포와 조직 (예시)',
  summary:'[세포](cell)는 생명의 기본 단위예요.\n\n• [세포막](cell membrane): 물질의 출입을 조절해요.\n• [핵](nucleus): 유전물질(DNA)을 담고 있어요.\n• [미토콘드리아](mitochondria): ATP(에너지)를 만들어요.\n• [리보솜](ribosome): 단백질을 합성해요.\n\n세포가 모여 [조직](tissue)이 되고, 조직이 모여 기관이 돼요. 몸의 내부 환경을 일정하게 지키는 성질이 [항상성](homeostasis)이에요.',
  cards:[
   ['세포막 (cell membrane)','세포를 둘러싸고 물질의 출입을 조절하는 막'],
   ['핵 (nucleus)','유전물질 DNA를 보관하는 세포 소기관'],
   ['미토콘드리아 (mitochondria)','ATP를 만들어 에너지를 공급하는 소기관'],
   ['리보솜 (ribosome)','단백질을 합성하는 소기관'],
   ['확산 (diffusion)','농도가 높은 곳에서 낮은 곳으로 물질이 퍼지는 이동'],
   ['항상성 (homeostasis)','몸의 내부 환경을 일정하게 유지하려는 성질'],
   ['상피조직 (epithelial tissue)','몸의 표면과 관, 강의 안쪽을 덮는 조직']
  ]},
 {sub:'nurs',title:'활력징후 (예시)',
  summary:'[활력징후](vital signs)는 몸 상태를 빠르게 보여주는 기본 지표예요.\n\n• [체온](body temperature)\n• [맥박](pulse): 성인 정상 60~100회/분\n• [호흡](respiration): 성인 정상 12~20회/분\n• [혈압](blood pressure)\n\n보조 지표로 [산소포화도](SpO2)도 자주 확인해요. 수치는 교재와 병원 기준을 한 번 더 확인해서 고쳐 적어요.',
  cards:[
   ['활력징후 (vital signs)','체온, 맥박, 호흡, 혈압처럼 생명 상태를 보여주는 기본 지표'],
   ['빈맥 (tachycardia)','성인 맥박이 분당 100회를 넘는 상태'],
   ['서맥 (bradycardia)','성인 맥박이 분당 60회보다 적은 상태'],
   ['빈호흡 (tachypnea)','호흡수가 정상보다 빠른 상태'],
   ['산소포화도 (SpO2)','혈액 속 헤모글로빈이 산소와 결합한 비율'],
   ['성인 정상 호흡수','분당 12~20회']
  ]}
];

const S={
  units:[], ready:false, slow:false, col:null, mode:'cloud',
  route:{view:'home'}, editSummary:false, editCard:null,
  deck:{idx:0,flip:false,starOnly:false,order:null},
  quiz:null, quizDir:'f2b', confirm:null, focus:null, scrollTo:null, top:false
};

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function rid(){return Math.random().toString(36).slice(2,9);}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let toastT=null;
function toast(msg){toastEl.firstElementChild.textContent=msg;toastEl.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('on'),3200);}
function unitsOf(sub){return S.units.filter(u=>u.subject===sub);}
function getUnit(id){return S.units.find(u=>u.id===id);}
function curUnit(){return S.route.view==='unit'?getUnit(S.route.unit):null;}
function cardsOf(u){return (u&&u.cards)||[];}
function countCards(list){return list.reduce((n,u)=>n+cardsOf(u).length,0);}
function typingNow(){const a=document.activeElement;return !!(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName)&&app.contains(a));}

/* ---------- persistence ---------- */
const queues=new Map();
let seq=0;
function enqueue(id,fn){
  if(!S.col)return Promise.resolve();
  const prev=queues.get(id)||Promise.resolve();
  const p=prev.then(fn).catch(err=>{console.error(err);toast('저장하지 못했어요. 연결을 확인하고 다시 시도해 주세요.');});
  queues.set(id,p);
  return p;
}
function persist(id,patch){return enqueue(id,()=>S.col.doc(id).update(patch));}
function patchUnit(id,patch,opts){
  const u=getUnit(id);if(!u)return Promise.resolve();
  Object.assign(u,patch);
  const p=persist(id,patch);
  if(!opts||opts.render!==false)render();
  return p;
}
function createUnit(subject,title,summary,cards){
  const id=S.col?S.col.doc().id:'l'+rid();
  const data={subject,title,summary:summary||'',cards:cards||[],createdAt:Date.now()+(seq++),best:null};
  S.units=S.units.concat([Object.assign({id},data)]);
  enqueue(id,()=>S.col.doc(id).set(data));
  return id;
}
function removeUnit(id){
  S.units=S.units.filter(u=>u.id!==id);
  enqueue(id,()=>S.col.doc(id).delete());
}
let sumT=null,sumId=null;
function setSumState(t){const el=document.getElementById('sumState');if(el)el.textContent=t;}
function flushSummary(){
  if(sumT===null)return;
  clearTimeout(sumT);sumT=null;
  const u=getUnit(sumId);if(!u)return;
  persist(u.id,{summary:u.summary||''}).then(()=>setSumState(S.col?'저장됨':'이 화면에만 임시로 보관돼요'));
}

      <textarea id="summaryText" rows="12" maxlength="20000" placeholder="이 단원에서 배운 내용을 내 말로 요약해 보세요.">${esc(u.summary||'')}</textarea>

function deckCards(u){
  let list=cardsOf(u);
  if(S.deck.order){
    const map=new Map(list.map(c=>[c.id,c]));
    const ordered=S.deck.order.map(id=>map.get(id)).filter(Boolean);
    list.forEach(c=>{if(!S.deck.order.includes(c.id))ordered.push(c);});
    list=ordered;
  }
  return S.deck.starOnly?list.filter(c=>c.star):list;
}

function cardsPanel(u){
  const cards=cardsOf(u),dc=deckCards(u);
  let deck;
  if(!cards.length){
    deck=`<div class="empty" style="margin-top:0"><p>카드를 만들면 여기서 뒤집어 가며 외울 수 있어요. 아래에서 첫 카드를 추가해 보세요.</p></div>`;
  }else if(!dc.length){
    deck=`<div class="empty" style="margin-top:0"><p>★ 표시한 카드가 아직 없어요.</p><button class="btn ghost" data-act="toggleStar">전체 카드 보기</button></div>`;
  }else{
    if(S.deck.idx>=dc.length)S.deck.idx=0;
    const c=dc[S.deck.idx];
    deck=`<div class="deck-top"><span class="count">${S.deck.idx+1} / ${dc.length}</span>
      <div class="chips"><button class="chip ${S.deck.starOnly?'on':''}" data-act="toggleStar" aria-pressed="${S.deck.starOnly}">★ 헷갈리는 카드만</button><button class="chip" data-act="shuffle">섞기</button></div></div>

        <button class="btn ${c.star?'':'ghost'}" data-act="star" aria-pressed="${!!c.star}">★ 헷갈려요</button>
        <button class="round" data-act="next" aria-label="다음 카드">${ICON_R}</button></div>`;
  }
  const ed=S.editCard?cards.find(c=>c.id===S.editCard):null;

    <label for="cardF">용어 (앞면)</label><input id="cardF" maxlength="80" autocomplete="off" value="${esc(ed?ed.f:'')}" placeholder="예: 빈맥 (tachycardia)">
    <label for="cardB">뜻 (뒷면)</label><textarea id="cardB" rows="2" maxlength="400" placeholder="예: 성인 맥박이 분당 100회를 넘는 상태">${esc(ed?ed.b:'')}</textarea>
    <div class="row end">${ed?'<button type="button" class="btn ghost" data-act="cancelEdit">취소</button>':''}<button class="btn" type="submit">${ed?'수정 완료':'카드 추가'}</button></div></form>`;
  const list=cards.length?`<ul class="cardlist card" style="padding-block:6px">${cards.map(c=>`<li class="crow"><div class="cr-text"><p class="cr-f">${c.star?'<span class="star" aria-label="헷갈리는 카드">★</span> ':''}${esc(c.f)}</p><p class="cr-b">${esc(c.b)}</p></div>
    <div class="cr-btns"><button class="linkbtn" data-act="editCard" data-id="${c.id}">수정</button><button class="linkbtn danger" data-act="delCard" data-id="${c.id}">${S.confirm==='card:'+c.id?'정말 삭제':'삭제'}</button></div></li>`).join('')}</ul>`:'';
  return deck+form+list;

function quizPanel(u){
  const Q=S.quiz;
  const n=cardsOf(u).length;
  if(!Q){
    const ok=n>=2;
    return `<div class="card quizstart"><h3>카드로 퀴즈 풀기</h3>
      <p>이 단원 카드 ${n}장에서 ${Math.min(n,10)}문제를 골라요. 보기는 다른 카드의 답으로 채워져요.</p>
      <div class="seg" role="group" aria-label="문제 방향">
        <button class="${S.quizDir==='f2b'?'on':''}" data-act="qdir" data-dir="f2b">용어 보고<br>뜻 고르기</button>
        <button class="${S.quizDir==='b2f'?'on':''}" data-act="qdir" data-dir="b2f">뜻 보고<br>용어 고르기</button></div>
      ${u.best!=null?`<p>지난 최고 점수 ${u.best}%</p>`:''}
      <button class="btn wide" data-act="qstart" ${ok?'':'disabled'}>시작하기</button>
      ${ok?'':'<p>카드를 2장 이상 만들면 퀴즈가 열려요.</p>'}</div>`;
  }
  const total=Q.qs.length;
  if(Q.done){
    const right=Q.results.filter(Boolean).length,pct=Math.round(right/total*100);
    const wrong=Q.qs.filter((q,i)=>!Q.results[i]);
    const msg=pct>=90?'거의 완벽해요.':pct>=70?'좋아요. 헷갈린 카드만 한 번 더 봐요.':'카드를 한 번 더 넘겨 보고 다시 도전해요.';
    return `<div class="card result"><div class="ring" style="--p:${pct}"><span>${pct}<small>%</small></span></div>
      <p class="rtext">${total}문제 중 ${right}문제 맞았어요</p><p class="rmsg">${msg}</p>
      ${wrong.length?`<h3>다시 볼 카드</h3><ul class="wronglist">${wrong.map(q=>`<li><b>${esc(q.q)}</b><br>${esc(q.ans)}</li>`).join('')}</ul><button class="btn wide" data-act="qretry">틀린 문제만 다시</button>`:''}
      <button class="btn ghost wide" data-act="qrestart">처음으로</button></div>`;
  }
  const q=Q.qs[Q.i],picked=Q.picked,answered=picked!=null;
  const right=answered&&q.opts[picked]===q.ans;
  const last=Q.i+1>=total;
  return `<div class="card quizrun"><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${Q.i+(answered?1:0)}"><span style="width:${(Q.i+(answered?1:0))/total*100}%"></span></div>
    <p class="qcount">${Q.i+1} / ${total}</p>
    <p class="qtext"><span class="qtag">${Q.dir==='f2b'?'용어':'뜻'}</span>${esc(q.q)}</p>
    <div class="opts">${q.opts.map((o,i)=>{
      const cls=answered?(o===q.ans?'right':(i===picked?'wrong':'')):'';
      return `<button class="opt ${cls}" data-act="qpick" data-i="${i}" ${answered?'disabled':''}><span class="num">${'①②③④'[i]||i+1}</span><span>${esc(o)}</span></button>`;
    }).join('')}</div>
    ${answered?`<p class="fb ${right?'good':'bad'}">${right?'정답이에요.':'오답이에요. 초록색 보기가 정답이에요.'}</p><button id="nextQ" class="btn wide" data-act="qnext">${last?'결과 보기':'다음 문제'}</button>`:''}</div>`;
}

function render(){
  let html;
  if(!S.ready)html=loadingView();
  else{
    if(S.route.view==='unit'&&!curUnit())S.route={view:'sub',sub:S.route.sub||'term'};
    if(S.route.view==='sub')html=subjectView(S.route.sub);
    else if(S.route.view==='unit')html=unitView(curUnit());
    else html=homeView();
  }
  app.innerHTML=html;
  if(S.focus){const el=document.querySelector(S.focus);if(el)el.focus();S.focus=null;}
  if(S.scrollTo){const el=document.querySelector(S.scrollTo);if(el)el.scrollIntoView({block:'start'});S.scrollTo=null;}
  if(S.top){window.scrollTo(0,0);S.top=false;}
}

/* ---------- quiz ---------- */
function buildQuiz(u,dir,only){
  const get=c=>dir==='f2b'?c.b:c.f,ask=c=>dir==='f2b'?c.f:c.b;
  let base=cardsOf(u);
  if(only)base=base.filter(c=>only.includes(c.id));
  base=shuffle(base).slice(0,10);
  const sameUnit=cardsOf(u);
  const sameSub=S.units.filter(x=>x.id!==u.id&&x.subject===u.subject).flatMap(cardsOf);
  const others=S.units.filter(x=>x.subject!==u.subject).flatMap(cardsOf);
  return base.map(c=>{
    const ans=get(c),seen=new Set([ans.trim().toLowerCase()]),pick=[];
    for(const tier of [sameUnit,sameSub,others]){
      for(const d of shuffle(tier)){
        if(pick.length>=3)break;
        if(d.id===c.id)continue;
        const t=get(d),key=t.trim().toLowerCase();
        if(!key||seen.has(key))continue;
        seen.add(key);pick.push(t);
      }
      if(pick.length>=3)break;
    }
    return {cid:c.id,q:ask(c),ans,opts:shuffle([ans].concat(pick))};
  });
}

/* ---------- actions ---------- */
function openUnit(id){
  const u=getUnit(id);if(!u)return;
  S.route={view:'unit',sub:u.subject,unit:id,tab:'summary'};
  S.editSummary=false;S.editCard=null;S.quiz=null;S.confirm=null;
  S.deck={idx:0,flip:false,starOnly:false,order:null};
  S.top=true;render();
}
function seed(){
  EXAMPLES.forEach(x=>createUnit(x.sub,x.title,x.summary,x.cards.map(p=>({id:rid(),f:p[0],b:p[1],star:false}))));
  render();toast('예시 단원 3개를 넣었어요.');
}

app.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el||el.tagName==='FORM')return;
  const a=el.dataset.act,d=el.dataset;
  const hadConfirm=!!S.confirm;
  if(a!=='delUnit'&&a!=='delCard')S.confirm=null;
  const u=curUnit();
  switch(a){
    case 'home':flushSummary();S.route={view:'home'};S.top=true;render();break;
    case 'openSub':flushSummary();S.route={view:'sub',sub:d.sub};S.top=true;render();break;
    case 'openUnit':flushSummary();openUnit(d.id);break;
    case 'seed':seed();break;
    case 'tab':flushSummary();S.route.tab=d.tab;S.editSummary=false;S.editCard=null;render();break;
    case 'editSummary':S.editSummary=true;S.focus='#summaryText';render();break;
    case 'doneSummary':flushSummary();S.editSummary=false;render();break;
    case 'flip':{
      S.deck.flip=!S.deck.flip;
      if(hadConfirm)render();else el.classList.toggle('is-flipped',S.deck.flip);
      break;}
    case 'next':case 'prev':{
      const dc=deckCards(u);if(!dc.length)break;
      S.deck.idx=(S.deck.idx+(a==='next'?1:dc.length-1))%dc.length;S.deck.flip=false;render();break;}
    case 'shuffle':S.deck.order=shuffle(cardsOf(u).map(c=>c.id));S.deck.idx=0;S.deck.flip=false;render();break;
    case 'toggleStar':S.deck.starOnly=!S.deck.starOnly;S.deck.idx=0;S.deck.flip=false;render();break;
    case 'star':{
      const dc=deckCards(u),c=dc[S.deck.idx];if(!c)break;
      patchUnit(u.id,{cards:cardsOf(u).map(x=>x.id===c.id?Object.assign({},x,{star:!x.star}):x)});break;}
    case 'editCard':S.editCard=d.id;S.scrollTo='.cardform';S.focus='#cardF';render();break;
    case 'cancelEdit':S.editCard=null;render();break;
    case 'delCard':{
      const key='card:'+d.id;
      if(S.confirm===key){S.confirm=null;if(S.editCard===d.id)S.editCard=null;patchUnit(u.id,{cards:cardsOf(u).filter(c=>c.id!==d.id)});}
      else{S.confirm=key;render();}
      break;}
    case 'delUnit':
      if(S.confirm==='unit'){const sub=u.subject;S.confirm=null;removeUnit(u.id);S.route={view:'sub',sub};S.top=true;render();toast('단원을 지웠어요.');}
      else{S.confirm='unit';render();}
      break;
    case 'qdir':S.quizDir=d.dir;render();break;
    case 'qstart':{
      const qs=buildQuiz(u,S.quizDir,null);if(!qs.length)break;
      S.quiz={dir:S.quizDir,only:null,qs,i:0,picked:null,results:[],done:false};S.scrollTo='.quizrun';render();break;}
    case 'qpick':{
      const Q=S.quiz;if(!Q||Q.picked!=null)break;
      const i=+d.i,q=Q.qs[Q.i];Q.picked=i;Q.results[Q.i]=(q.opts[i]===q.ans);
      S.scrollTo='#nextQ';render();break;}
    case 'qnext':{
      const Q=S.quiz;if(!Q)break;
      if(Q.i+1<Q.qs.length){Q.i++;Q.picked=null;S.scrollTo='.quizrun';render();}
      else{
        Q.done=true;
        const pct=Math.round(Q.results.filter(Boolean).length/Q.qs.length*100);
        S.scrollTo='.result';
        if(!Q.only&&(u.best==null||pct>u.best))patchUnit(u.id,{best:pct});else render();
      }
      break;}
    case 'qretry':{
      const Q=S.quiz;if(!Q)break;
      const ids=Q.qs.filter((q,i)=>!Q.results[i]).map(q=>q.cid);
      const qs=buildQuiz(u,Q.dir,ids);if(!qs.length)break;
      S.quiz={dir:Q.dir,only:ids,qs,i:0,picked:null,results:[],done:false};S.scrollTo='.quizrun';render();break;}
    case 'qrestart':S.quiz=null;S.top=true;render();break;
    default:break;
  }
});

app.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[data-act="flip"]')){e.preventDefault();e.target.click();}
});

app.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-act]');if(!f)return;
  e.preventDefault();
  if(f.dataset.act==='addUnit'){
    const inp=document.getElementById('newUnit'),title=inp.value.trim();
    if(!title){toast('단원 이름을 적어 주세요.');inp.focus();return;}
    const id=createUnit(S.route.sub,title,'',[]);
    openUnit(id);
  }
  if(f.dataset.act==='saveCard'){
    const u=curUnit();if(!u)return;
    const fe=document.getElementById('cardF'),be=document.getElementById('cardB');
    const front=fe.value.trim(),back=be.value.trim();
    if(!front||!back){toast(!front?'용어를 적어 주세요.':'뜻을 적어 주세요.');(!front?fe:be).focus();return;}
    let cards;
    if(S.editCard){cards=cardsOf(u).map(c=>c.id===S.editCard?Object.assign({},c,{f:front,b:back}):c);S.editCard=null;}
    else cards=cardsOf(u).concat([{id:rid(),f:front,b:back,star:false}]);
    S.focus='#cardF';
    patchUnit(u.id,{cards});
  }
});

app.addEventListener('input',e=>{
  if(e.target.id==='summaryText'){
    const u=curUnit();if(!u)return;
    u.summary=e.target.value;sumId=u.id;
    setSumState('저장 중…');
    clearTimeout(sumT);sumT=setTimeout(flushSummary,700);
  }
});
app.addEventListener('change',e=>{
  if(e.target.id==='unitTitle'){
    const u=getUnit(e.target.dataset.id);if(!u)return;
    const v=e.target.value.trim()||u.title||'새 단원';
    e.target.value=v;
    patchUnit(u.id,{title:v},{render:false});
  }
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushSummary();});
window.addEventListener('pagehide',flushSummary);

/* ---------- boot ---------- */
async function boot(){
  render();
  let db=null,user=null,uid=null;
  try{
    if(window.claude&&window.claude.use){
      const r=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      db=r[0];user=r[1];
      if(user)uid=await user.id();
    }
  }catch(err){console.error(err);}
  if(!db||!uid){S.mode='local';S.ready=true;render();return;}
  S.col=db.collection('data/users/'+uid);
  const slowT=setTimeout(()=>{S.slow=true;if(!S.ready)render();},10000);
  S.col.onSnapshot(snap=>{
    clearTimeout(slowT);
    S.units=snap.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    const first=!S.ready;
    S.ready=true;
    if(first||!typingNow())render();
  },err=>{
    clearTimeout(slowT);
    console.error(err);
    S.col=null;S.mode='local';S.ready=true;render();
  });
}
boot();
})();
</script>
